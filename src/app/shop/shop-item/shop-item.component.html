
<div class="card product-card h-100">

  @if (product.photos?.length) {
    <!-- Main Image -->
    <div class="main-image-container">
      <img
        [src]="Localhost + selectedImage"
        [alt]="product.name"
        class="main-product-image"
      >
    </div>

    <!-- Thumbnail Images -->
    @if (product.photos.length > 1) {
      <div class="product-thumbnails">
        @for (photo of product.photos; track $index) {
          <button
            type="button"
            class="thumbnail-button"
            [class.active]="selectedImage === photo.imageName"
            (click)="selectImage(photo.imageName)"
            [attr.aria-label]="'View image ' + ($index + 1)"
          >
            <img
              [src]="Localhost+ photo.imageName"
              [alt]="product.name + ' image ' + ($index + 1)"
              class="thumbnail-image"
            >
          </button>
        }
      </div>
    }
  } @else {
    <div class="product-image-placeholder">
      <i class="bi bi-image"></i>
      <span>No image available</span>
    </div>
  }

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.name }}</h5>

    <p class="card-text product-description">
      {{ product.description }}
    </p>

    <div class="product-prices mt-auto mb-2">
      <span class="current-price">{{ product.price }} EGP</span>
      <span class="old-price">{{ product.oldPrice }} EGP</span>
    </div>

    <div class="product-actions">
      <button type="button" class="btn btn-favorite"
              aria-label="Add to favorites">
        <i class="bi bi-heart"></i>
      </button>

      <button type="button" class="btn btn-luxury add-to-cart-btn" (click)="addToCart(product)" aria-label="Add to cart">
        <i class="bi bi-cart-plus"></i>
        <span>Add To Cart</span>
      </button>

      <button routerLink="/products-details/{{ product.id }}" type="button" class="btn btn-product-details"
              aria-label="View product details">
        <i class="bi bi-info-circle"></i>
      </button>
    </div>
  </div>
</div>

<div class="container mt-5 mb-5">

  <!-- Page Title -->
  <h1 class="main-title mb-4">Shopping</h1>

  <div class="row g-4">

    <!-- Sidebar -->
    <aside class="col-12 col-lg-3">
      <div class="sidebar">

        <!-- Sorting -->
        <div class="sidebar-section">
          <h4 class="section-title">Sorting</h4>

          <select class="form-select" aria-label="Sort products" (change)="onSortChange($event)">
            @for (item of SortingOption; track $index) {
                <option [value]="item.value">{{item.name}}</option>
            }


          </select>
        </div>

        <!-- Categories -->
        <div class="sidebar-section">
          <h4 class="section-title">Categories</h4>

          <ul class="list-group custom-list-group">
            @for (category of categories(); track category.id) {
               <li [class.active]="category.id === CategoryId" (click)="selectedCategoryId(category.id)" class="list-group-item custom-list-item">{{category.name}}</li>
            }


          </ul>
        </div>
        <div class="sidebar-section"></div>
      </div>
    </aside>

    <!-- Products -->


    <section class="col-12 col-lg-9" aria-label="Products">


<!-- Products Toolbar -->
<div class="products-toolbar">
  <div class="products-count">
    Showing
    <strong>{{ products().length }}</strong>
    of
    <strong>{{ productParam.totalItems }}</strong>
    products
  </div>

  <div class="products-search">
    <i class="bi bi-search"></i>

    <input
      type="search"
      class="form-control"
      placeholder="Search products..."
      aria-label="Search products"
      [value]="searchTerm"
      (input)="onSearch($event)"
    />
  </div>
</div>

<!-- Products Grid -->
<div class="row g-4">
  @for (product of filteredProducts; track product.id) {
    <div class="col-12 col-sm-6 col-xl-4">
      <app-shop-item [product]="product" />
    </div>
  } @empty {
    <div class="col-12">
      <p class="empty-products">No products found.</p>
    </div>
  }
  <div class="d-flex justify-content-center">
   <app-pagination
  [pageSize]="productParam.pageSize"
  [totalItems]="productParam.totalItems"
  (pageChanged)="onPageChanged($event)"
></app-pagination>
  </div>
</div>
